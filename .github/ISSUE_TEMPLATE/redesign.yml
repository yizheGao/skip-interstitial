name: 停止页不跳了（疑似改版）
description: 发现某个中间页/停止页不再自动跳转时，提交脱敏后的现场信息
title: "[不跳] <域名> - <一句话现象>"
labels: ["redesign"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 `docs/DEBUG-zh.md`。**不要提交未经脱敏的完整 URL、页面源码、账号信息或会话票据。**
        URL 只保留域名、路径和参数名称；敏感参数值及个人链接请删除或替换为占位符。
  - type: input
    id: url
    attributes:
      label: 脱敏后的问题 URL
      description: 只需域名、路径和参数名称；删除所有参数值、个人标识和令牌。不要粘贴原始分享链接。
      placeholder: https://example.com/path?target=[已脱敏]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 扩展/脚本版本
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 141 / Edge 141 / Kiwi + Tampermonkey
    validations:
      required: true
  - type: textarea
    id: cgidata
    attributes:
      label: 相关 cgiData 字段（可选，必须脱敏）
      description: 不要粘贴完整 window.cgiData。只提供相关字段名、字段类型和虚构/脱敏后的示例值。
      render: json
    validations:
      required: false
  - type: textarea
    id: dom
    attributes:
      label: 与跳转有关的页面文本（可选，必须脱敏）
      description: 只摘录必要的几行；删除完整目标链接、个人信息和所有敏感参数值。
      render: text
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: 你判断卡在哪一层（不确定就选「不确定」）
      options:
        - 不确定
        - cgiData 里没有明文网址（可能被加密/编码）
        - 有明文网址但页面没跳
        - 有「继续访问」按钮但没被点击
        - 完全拉黑页，连「申请恢复」链接都没有
    validations:
      required: true
